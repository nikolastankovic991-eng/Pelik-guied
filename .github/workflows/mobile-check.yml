name: Mobile app checks

on:
  push:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-check.yml"
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-check.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13"
      - name: Install dependencies
        run: npm install
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Report all dependency advisories
        run: |
          npm audit --json > /tmp/npm-audit.json || true
          node -e 'const a=require("/tmp/npm-audit.json"); for (const [name, v] of Object.entries(a.vulnerabilities || {})) { const via=(v.via || []).map(x => typeof x === "string" ? x : x.title + " [" + x.range + "] " + x.url).join(" | "); console.log(name + ": " + v.severity + "; direct=" + v.isDirect + "; range=" + v.range + "; via=" + via + "; fix=" + JSON.stringify(v.fixAvailable)); }'
      - name: Validate destination content
        run: npm run validate:content
      - name: Validate website JavaScript
        run: npm run validate:web
      - name: TypeScript check
        run: npm run typecheck
      - name: Expo dependency check
        run: npx expo-doctor
      - name: Bundle iOS JavaScript
        run: npx expo export --platform ios --output-dir /tmp/gozo-guide-ios-export
      - name: Bundle Android JavaScript
        run: npx expo export --platform android --output-dir /tmp/gozo-guide-android-export